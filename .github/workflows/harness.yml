name: Harness checks
on:
  push:
    paths: ['harness/**', 'addons/pi-web-luna/**', '.github/workflows/harness.yml']
  pull_request:
    paths: ['harness/**', 'addons/pi-web-luna/**', '.github/workflows/harness.yml']
permissions:
  contents: read
jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix addons/pi-web-luna --workspaces=false --ignore-scripts
      - run: npm run harness:check
